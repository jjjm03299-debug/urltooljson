<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages Static API Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #333; }
        code { background: #f1f3f5; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        pre { background: #f8f9fa; padding: 15px; border-radius: 6px; overflow-x: auto; border: 1px solid #e9ecef; }
        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .endpoint-card { margin-bottom: 30px; border-bottom: 1px solid #eaecef; padding-bottom: 20px; }
    </style>
</head>
<body>
    <h1>GitHub Pages Static API Dashboard</h1>
    <p>Welcome! This site hosts static JSON endpoints served via GitHub Pages.</p>

    <!-- URLs Endpoint Section -->
    <div class="endpoint-card">
        <h2>1. URLs API Endpoint</h2>
        <p><strong>Endpoint URL:</strong> <a href="./api/get-url.json" target="_blank"><code>/api/get-url.json</code></a></p>
        <pre id="urls-output">Loading URLs data...</pre>
    </div>

    <!-- Health Check Endpoint Section -->
    <div class="endpoint-card">
        <h2>2. Health Check Endpoint</h2>
        <p><strong>Endpoint URL:</strong> <a href="./api/healthz.json" target="_blank"><code>/api/healthz.json</code></a></p>
        <pre id="health-output">Loading health data...</pre>
    </div>

    <script>
        // Fetch and display get-url.json
        fetch('./api/get-url.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('urls-output').textContent = JSON.stringify(data, null, 2);
            })
            .catch(err => {
                document.getElementById('urls-output').textContent = 'Error loading get-url.json data.';
            });

        // Fetch and display healthz.json
        fetch('./api/healthz.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('health-output').textContent = JSON.stringify(data, null, 2);
            })
            .catch(err => {
                document.getElementById('health-output').textContent = 'Error loading healthz.json data.';
            });
    </script>
</body>
</html>
